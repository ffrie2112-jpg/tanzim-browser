
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Tanzim Browser - সহজে Google-এ সার্চ করুন">
<title>Tanzim Browser</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#071b16;
  color:white;
  text-align:center;
  padding:70px 16px;
}
.logo{font-size:30px;font-weight:bold;color:#73e6a4}
p{color:#c5d9d0}
form{
  display:flex;
  gap:8px;
  max-width:520px;
  margin:28px auto;
}
input{
  flex:1;min-width:0;padding:15px;
  border-radius:28px;border:1px solid #4d7665;
  font-size:16px;
}
button{
  border:0;border-radius:25px;
  background:#26a269;color:white;
  padding:12px 18px;font-size:16px;
}
footer{margin-top:70px;color:#9eb8ad;font-size:13px}
</style>
</head>
<body>
<div class="logo">🌐 Tanzim Browser</div>
<p>তোমার ইন্টারনেট, তোমার পছন্দ!</p>
<form action="https://www.google.com/search" method="get">
<input name="q" type="search" placeholder="এখানে সার্চ করো..." required>
<button type="submit">Search</button>
</form>
<p>সহজে খুঁজে নাও তোমার প্রয়োজনীয় তথ্য</p>
<footer>© 2026 Tanzim Browser</footer>
</body>
</html>
